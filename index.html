<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#6C5CE7">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Kids Timer</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

:root {
  --bg: #1a1a2e;
  --card: #16213e;
  --card-border: rgba(255,255,255,0.05);
  --accent: #6C5CE7;
  --accent-light: #a29bfe;
  --text: #f0f0f0;
  --text-dim: #888;
  --danger: #e74c3c;
  --warning: #f39c12;
  --success: #00b894;
  --input-bg: rgba(255,255,255,0.05);
  --input-border: rgba(255,255,255,0.1);
  --btn-bg: rgba(255,255,255,0.08);
  --btn-border: rgba(255,255,255,0.08);
  --overlay: rgba(0,0,0,0.6);
  --shadow: rgba(108, 92, 231, 0.5);
}

[data-theme="light"] {
  --bg: #f0f0f5;
  --card: #ffffff;
  --card-border: rgba(0,0,0,0.08);
  --accent: #6C5CE7;
  --accent-light: #6C5CE7;
  --text: #1a1a2e;
  --text-dim: #777;
  --input-bg: rgba(0,0,0,0.04);
  --input-border: rgba(0,0,0,0.12);
  --btn-bg: rgba(0,0,0,0.05);
  --btn-border: rgba(0,0,0,0.1);
  --overlay: rgba(0,0,0,0.4);
  --shadow: rgba(108, 92, 231, 0.35);
}

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  padding: 0 0 100px 0;
  overflow-x: hidden;
  transition: background 0.3s, color 0.3s;
}

.header {
  padding: 16px 16px 12px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  background: var(--bg);
  z-index: 10;
  border-bottom: 1px solid var(--card-border);
  transition: background 0.3s;
}

.header h1 {
  font-size: 20px;
  font-weight: 700;
  color: var(--accent-light);
}

.btn-theme {
  background: var(--btn-bg);
  border: none;
  color: var(--text);
  width: 38px;
  height: 38px;
  border-radius: 50%;
  font-size: 20px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
}

.empty-state {
  text-align: center;
  padding: 80px 20px;
  color: var(--text-dim);
}

.empty-state .icon { font-size: 48px; margin-bottom: 16px; }
.empty-state p { font-size: 15px; line-height: 1.5; }

.timers-list { padding: 12px 16px; }

.timer-card {
  background: var(--card);
  border-radius: 16px;
  padding: 16px;
  margin-bottom: 12px;
  position: relative;
  overflow: hidden;
  transition: all 0.3s;
  border: 1px solid var(--card-border);
}

.timer-card.expiring { border-color: var(--warning); }

.timer-card.expired {
  border-color: var(--danger);
  animation: pulse 1s infinite;
}

@keyframes pulse {
  0%, 100% { background: var(--card); }
  50% { background: rgba(231, 76, 60, 0.12); }
}

.timer-top {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 8px;
}

.timer-info { flex: 1; min-width: 0; }

.timer-name {
  font-size: 17px;
  font-weight: 600;
  margin-bottom: 2px;
}

.timer-description {
  font-size: 13px;
  color: var(--text-dim);
  margin-bottom: 4px;
  line-height: 1.3;
  word-break: break-word;
}

.timer-end-time {
  font-size: 13px;
  color: var(--text-dim);
}

.timer-end-time span {
  color: var(--accent-light);
  font-weight: 600;
}

.timer-actions {
  display: flex;
  gap: 6px;
  flex-shrink: 0;
}

.btn-icon {
  background: var(--btn-bg);
  border: none;
  color: var(--text-dim);
  width: 32px;
  height: 32px;
  border-radius: 50%;
  font-size: 18px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
}

.btn-icon:active { opacity: 0.6; }
.btn-icon.dismiss:active { background: rgba(231, 76, 60, 0.3); color: var(--danger); }

.timer-countdown {
  font-size: 36px;
  font-weight: 700;
  text-align: center;
  margin: 12px 0 8px;
  font-variant-numeric: tabular-nums;
}

.timer-card.expired .timer-countdown { color: var(--danger); }
.timer-card.expiring .timer-countdown { color: var(--warning); }
.timer-card:not(.expired):not(.expiring) .timer-countdown { color: var(--success); }

.progress-bar {
  height: 4px;
  background: var(--btn-bg);
  border-radius: 2px;
  overflow: hidden;
}

.progress-fill {
  height: 100%;
  border-radius: 2px;
  transition: width 1s linear;
  background: var(--success);
}

.timer-card.expiring .progress-fill { background: var(--warning); }
.timer-card.expired .progress-fill { background: var(--danger); }

.timer-duration-badge {
  display: inline-block;
  font-size: 11px;
  color: var(--text-dim);
  margin-top: 8px;
}

/* Add time buttons on timer card */
.timer-add-time {
  display: none;
  gap: 8px;
  margin-top: 12px;
}

.timer-add-time.visible { display: flex; }

.btn-add-time {
  flex: 1;
  padding: 10px 4px;
  border-radius: 10px;
  border: 1px solid var(--btn-border);
  background: var(--btn-bg);
  color: var(--accent-light);
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
}

.btn-add-time:active {
  background: var(--accent);
  color: white;
  border-color: var(--accent);
}

/* FAB */
.fab {
  position: fixed;
  bottom: 28px;
  right: 20px;
  width: 60px;
  height: 60px;
  border-radius: 50%;
  background: var(--accent);
  border: none;
  color: white;
  font-size: 32px;
  cursor: pointer;
  box-shadow: 0 4px 20px var(--shadow);
  z-index: 100;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: transform 0.2s;
}

.fab:active { transform: scale(0.9); }

/* Modal overlay */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: var(--overlay);
  z-index: 200;
  display: none;
  align-items: flex-end;
  justify-content: center;
}

.modal-overlay.active { display: flex; }

.modal {
  background: var(--card);
  border-radius: 20px 20px 0 0;
  padding: 20px 16px 32px;
  width: 100%;
  max-width: 500px;
  animation: slideUp 0.25s ease-out;
  max-height: 90vh;
  overflow-y: auto;
}

@keyframes slideUp {
  from { transform: translateY(100%); }
  to { transform: translateY(0); }
}

.modal-handle {
  width: 40px;
  height: 4px;
  background: var(--btn-bg);
  border-radius: 2px;
  margin: 0 auto 20px;
}

.modal h2 {
  font-size: 18px;
  margin-bottom: 16px;
  text-align: center;
}

.modal-input {
  width: 100%;
  padding: 14px 16px;
  border-radius: 12px;
  border: 1px solid var(--input-border);
  background: var(--input-bg);
  color: var(--text);
  font-size: 16px;
  outline: none;
  margin-bottom: 12px;
  font-family: inherit;
}

textarea.modal-input {
  resize: vertical;
  min-height: 60px;
  line-height: 1.4;
}

.modal-input:focus { border-color: var(--accent); }
.modal-input::placeholder { color: var(--text-dim); }

.modal-label {
  font-size: 13px;
  color: var(--text-dim);
  margin-bottom: 6px;
  display: block;
}

.duration-selector {
  margin-bottom: 16px;
}

.duration-buttons {
  display: flex;
  gap: 10px;
  margin-bottom: 8px;
}

.btn-duration {
  flex: 1;
  padding: 14px 8px;
  border-radius: 14px;
  border: 2px solid var(--btn-border);
  background: var(--btn-bg);
  color: var(--text);
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  text-align: center;
  transition: all 0.15s;
}

.btn-duration:active {
  background: var(--accent);
  border-color: var(--accent);
  color: white;
  transform: scale(0.96);
}

.btn-duration .time { font-size: 20px; display: block; margin-bottom: 2px; }

.selected-duration {
  text-align: center;
  padding: 12px;
  background: var(--input-bg);
  border-radius: 12px;
  font-size: 15px;
  color: var(--text);
  display: none;
  align-items: center;
  justify-content: center;
  gap: 8px;
}

.selected-duration.visible { display: flex; }

.selected-duration strong {
  color: var(--accent-light);
  font-size: 20px;
}

.btn-reset-duration {
  background: var(--btn-bg);
  border: none;
  color: var(--text-dim);
  width: 28px;
  height: 28px;
  border-radius: 50%;
  font-size: 14px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
}

.btn-start {
  width: 100%;
  padding: 16px;
  border-radius: 14px;
  border: none;
  background: var(--accent);
  color: white;
  font-size: 16px;
  font-weight: 700;
  cursor: pointer;
  transition: opacity 0.2s;
}

.btn-start:disabled {
  opacity: 0.3;
  cursor: default;
}

.btn-start:not(:disabled):active { opacity: 0.8; }

.btn-cancel {
  width: 100%;
  padding: 14px;
  margin-top: 10px;
  border-radius: 12px;
  border: none;
  background: var(--btn-bg);
  color: var(--text-dim);
  font-size: 15px;
  cursor: pointer;
}

/* Responsive */
@media (min-width: 600px) {
  .timers-list { max-width: 560px; margin: 0 auto; }
  .header { max-width: 560px; margin: 0 auto; border-bottom: none; }
  .fab { bottom: 32px; right: calc(50% - 280px + 20px); }
}
</style>
</head>
<body>

<div class="header">
  <h1>Kids Timer</h1>
  <button class="btn-theme" id="themeBtn" title="Switch theme">&#9790;</button>
</div>

<div id="emptyState" class="empty-state">
  <div class="icon">&#128678;</div>
  <p>Пока нет активных таймеров<br>Нажмите <b>+</b> чтобы добавить</p>
</div>

<div id="timersList" class="timers-list"></div>

<button class="fab" id="fabBtn">+</button>

<!-- New timer modal -->
<div class="modal-overlay" id="modal">
  <div class="modal">
    <div class="modal-handle"></div>
    <h2>Новый таймер</h2>

    <input type="text" class="modal-input" id="nameInput" placeholder="Имя ребёнка (необязательно)" autocomplete="off">

    <textarea class="modal-input" id="descInput" placeholder="Описание: во что одет, особые приметы..." rows="2"></textarea>

    <div class="duration-selector">
      <label class="modal-label">Нажимайте чтобы добавить время:</label>
      <div class="duration-buttons">
        <button class="btn-duration" data-minutes="1">
          <span class="time">+1</span> мин
        </button>
        <button class="btn-duration" data-minutes="30">
          <span class="time">+30</span> мин
        </button>
        <button class="btn-duration" data-minutes="60">
          <span class="time">+1</span> час
        </button>
        <button class="btn-duration" data-minutes="120">
          <span class="time">+2</span> часа
        </button>
      </div>
      <div class="selected-duration" id="selectedDuration">
        Итого: <strong id="totalTimeDisplay">0 мин</strong>
        <button class="btn-reset-duration" id="resetDuration" title="Сбросить">&#8634;</button>
      </div>
    </div>

    <button class="btn-start" id="btnStart" disabled>Запустить</button>
    <button class="btn-cancel" id="btnCancel">Отмена</button>
  </div>
</div>

<!-- Add time to existing timer modal -->
<div class="modal-overlay" id="addTimeModal">
  <div class="modal">
    <div class="modal-handle"></div>
    <h2 id="addTimeTitle">Добавить время</h2>
    <div class="duration-buttons">
      <button class="btn-duration btn-add-existing" data-minutes="1">
        <span class="time">+1</span> мин
      </button>
      <button class="btn-duration btn-add-existing" data-minutes="30">
        <span class="time">+30</span> мин
      </button>
      <button class="btn-duration btn-add-existing" data-minutes="60">
        <span class="time">+1</span> час
      </button>
      <button class="btn-duration btn-add-existing" data-minutes="120">
        <span class="time">+2</span> часа
      </button>
    </div>
    <button class="btn-cancel" id="btnCancelAdd">Отмена</button>
  </div>
</div>

<script>
const STORAGE_KEY = 'kids_timers';
const THEME_KEY = 'kids_timer_theme';

let timers = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
let pendingMinutes = 0;
let addTimeTargetId = null;

const $ = id => document.getElementById(id);
const timersList = $('timersList');
const emptyState = $('emptyState');
const modal = $('modal');
const addTimeModal = $('addTimeModal');
const nameInput = $('nameInput');
const descInput = $('descInput');
const fabBtn = $('fabBtn');
const btnCancel = $('btnCancel');
const btnCancelAdd = $('btnCancelAdd');
const btnStart = $('btnStart');
const selectedDuration = $('selectedDuration');
const totalTimeDisplay = $('totalTimeDisplay');
const resetDuration = $('resetDuration');
const themeBtn = $('themeBtn');
const addTimeTitle = $('addTimeTitle');

// --- Theme ---
function loadTheme() {
  const theme = localStorage.getItem(THEME_KEY) || 'dark';
  document.documentElement.setAttribute('data-theme', theme);
  themeBtn.textContent = theme === 'dark' ? '\u263E' : '\u2600';
}

themeBtn.addEventListener('click', () => {
  const current = document.documentElement.getAttribute('data-theme');
  const next = current === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  localStorage.setItem(THEME_KEY, next);
  themeBtn.textContent = next === 'dark' ? '\u263E' : '\u2600';
});

loadTheme();

// --- Audio ---
function playAlarm() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    [0, 200, 400].forEach(delay => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.frequency.value = 880;
      osc.type = 'sine';
      gain.gain.value = 0.3;
      osc.start(ctx.currentTime + delay / 1000);
      osc.stop(ctx.currentTime + delay / 1000 + 0.15);
    });
  } catch(e) {}
}

// --- Storage ---
function save() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(timers));
}

// --- Formatting ---
function formatTime(ms) {
  if (ms <= 0) return '00:00';
  const totalSec = Math.floor(ms / 1000);
  const h = Math.floor(totalSec / 3600);
  const m = Math.floor((totalSec % 3600) / 60);
  const s = totalSec % 60;
  if (h > 0) return `${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}

function formatClockTime(timestamp) {
  return new Date(timestamp).toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
}

function formatMinutes(min) {
  if (min < 60) return min + ' мин';
  const h = Math.floor(min / 60);
  const m = min % 60;
  let s = h + ' ч';
  if (m > 0) s += ' ' + m + ' мин';
  return s;
}

function escHtml(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

// --- New Timer Modal ---
function openModal() {
  nameInput.value = '';
  descInput.value = '';
  pendingMinutes = 0;
  updatePendingDisplay();
  modal.classList.add('active');
  setTimeout(() => nameInput.focus(), 100);
}

function closeModal() {
  modal.classList.remove('active');
}

function updatePendingDisplay() {
  if (pendingMinutes > 0) {
    selectedDuration.classList.add('visible');
    totalTimeDisplay.textContent = formatMinutes(pendingMinutes);
    btnStart.disabled = false;
  } else {
    selectedDuration.classList.remove('visible');
    btnStart.disabled = true;
  }
}

document.querySelectorAll('.modal .btn-duration').forEach(btn => {
  btn.addEventListener('click', () => {
    pendingMinutes += parseInt(btn.dataset.minutes);
    updatePendingDisplay();
  });
});

resetDuration.addEventListener('click', () => {
  pendingMinutes = 0;
  updatePendingDisplay();
});

btnStart.addEventListener('click', () => {
  if (pendingMinutes <= 0) return;
  const name = nameInput.value.trim() || 'Ребёнок';
  const desc = descInput.value.trim();
  const now = Date.now();
  const duration = pendingMinutes * 60 * 1000;
  timers.push({
    id: now,
    name,
    description: desc,
    startTime: now,
    duration,
    endTime: now + duration,
    notified: false
  });
  save();
  closeModal();
  render();
});

fabBtn.addEventListener('click', openModal);
btnCancel.addEventListener('click', closeModal);
modal.addEventListener('click', e => { if (e.target === modal) closeModal(); });

// --- Add Time to Existing Timer ---
function openAddTimeModal(id) {
  addTimeTargetId = id;
  const t = timers.find(t => t.id === id);
  if (t) addTimeTitle.textContent = 'Добавить время: ' + t.name;
  addTimeModal.classList.add('active');
}

function closeAddTimeModal() {
  addTimeModal.classList.remove('active');
  addTimeTargetId = null;
}

document.querySelectorAll('.btn-add-existing').forEach(btn => {
  btn.addEventListener('click', () => {
    if (addTimeTargetId === null) return;
    const t = timers.find(t => t.id === addTimeTargetId);
    if (!t) return;
    const addMs = parseInt(btn.dataset.minutes) * 60 * 1000;
    t.endTime += addMs;
    t.duration += addMs;
    if (t.notified) t.notified = false;
    save();
    closeAddTimeModal();
    render();
  });
});

btnCancelAdd.addEventListener('click', closeAddTimeModal);
addTimeModal.addEventListener('click', e => { if (e.target === addTimeModal) closeAddTimeModal(); });

// --- Remove Timer ---
function removeTimer(id) {
  timers = timers.filter(t => t.id !== id);
  save();
  render();
}

// --- Render ---
function render() {
  timers.sort((a, b) => a.endTime - b.endTime);
  emptyState.style.display = timers.length === 0 ? 'block' : 'none';

  timersList.innerHTML = timers.map(t => {
    const now = Date.now();
    const remaining = t.endTime - now;
    const elapsed = now - t.startTime;
    const progress = Math.max(0, Math.min(100, (elapsed / t.duration) * 100));
    const isExpired = remaining <= 0;
    const isExpiring = !isExpired && remaining < 5 * 60 * 1000;

    let statusClass = '';
    if (isExpired) statusClass = 'expired';
    else if (isExpiring) statusClass = 'expiring';

    const descHtml = t.description
      ? `<div class="timer-description">${escHtml(t.description)}</div>`
      : '';

    return `
      <div class="timer-card ${statusClass}" data-id="${t.id}">
        <div class="timer-top">
          <div class="timer-info">
            <div class="timer-name">${escHtml(t.name)}</div>
            ${descHtml}
            <div class="timer-end-time">Выход в <span>${formatClockTime(t.endTime)}</span></div>
          </div>
          <div class="timer-actions">
            <button class="btn-icon" onclick="openAddTimeModal(${t.id})" title="Добавить время">+</button>
            <button class="btn-icon dismiss" onclick="removeTimer(${t.id})" title="Удалить">&#10005;</button>
          </div>
        </div>
        <div class="timer-countdown">${isExpired ? 'ВРЕМЯ ВЫШЛО' : formatTime(remaining)}</div>
        <div class="progress-bar"><div class="progress-fill" style="width:${progress}%"></div></div>
        <div class="timer-duration-badge">${formatMinutes(t.duration / 60000)}</div>
      </div>
    `;
  }).join('');
}

// --- Tick ---
setInterval(() => {
  render();
  timers.forEach(t => {
    if (!t.notified && Date.now() >= t.endTime) {
      t.notified = true;
      save();
      playAlarm();
      if ('vibrate' in navigator) navigator.vibrate([300, 100, 300, 100, 300]);
    }
  });
}, 1000);

render();

// --- Service Worker ---
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js');
}
</script>
</body>
</html>
