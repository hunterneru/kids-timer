<!DOCTYPE html>
<html><body>
<canvas id="c192" width="192" height="192"></canvas>
<canvas id="c512" width="512" height="512"></canvas>
<script>
function draw(canvasId, size) {
  const c = document.getElementById(canvasId);
  const ctx = c.getContext('2d');
  // Background
  ctx.fillStyle = '#6C5CE7';
  ctx.beginPath();
  ctx.roundRect(0, 0, size, size, size * 0.2);
  ctx.fill();
  // Clock emoji
  ctx.font = `${size * 0.45}px serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('\u23F0', size/2, size * 0.45);
  // Text
  ctx.fillStyle = 'white';
  ctx.font = `bold ${size * 0.13}px -apple-system, sans-serif`;
  ctx.fillText('KIDS', size/2, size * 0.78);

  // Download link
  const a = document.createElement('a');
  a.download = `icon-${size}.png`;
  a.href = c.toDataURL('image/png');
  a.textContent = `Download ${size}`;
  document.body.appendChild(a);
  a.click();
}
draw('c192', 192);
draw('c512', 512);
</script>
<p>Icons downloaded! You can close this page.</p>
</body></html>
